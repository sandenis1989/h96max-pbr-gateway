# Interface binding
interface=wlan0
bind-dynamic

# DHCP configuration
dhcp-range=192.168.12.50,192.168.12.200,255.255.255.0,24h
dhcp-option=option:router,192.168.12.1
dhcp-option=option:dns-server,192.168.12.1

# Upstream DNS servers
no-resolv
server=1.1.1.1
server=8.8.8.8
server=77.88.8.8

# Domain settings
domain-needed
bogus-priv

# LAN is IPv4-only: wlan0 has no global IPv6 prefix, so AAAA answers are
# unusable. Strip them here (this instance is bound to wlan0) so clients do
# not spend time on broken IPv6 before falling back to IPv4.
filter-AAAA

# Include sub-configurations (e.g., nftset domain mapping)
conf-dir=/etc/dnsmasq.d,.conf
